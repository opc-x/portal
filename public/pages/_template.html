<!doctype html>
<!--
  子页面模板（以 _ 开头，不会出现在首页）
  用法：复制一份，改个名字，比如 about.html（中文）或 about.en.html（英文），
  改掉下面的 <title> 和正文，提交推送，首页就会自动多一条链接。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面标题</title>
  <style>
    body { margin: 0; background: #09090b; color: #e4e4e7; font: 16px/1.8 -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; }
    main { max-width: 680px; margin: 0 auto; padding: 64px 24px; }
    a { color: #a1a1aa; }
    a:hover { color: #fafafa; }
    h1 { font-size: 32px; line-height: 1.3; margin: 24px 0 16px; }
    p, li { color: #a1a1aa; }
  </style>
</head>
<body>
  <main>
    <a href="/">← 返回</a>
    <h1>页面标题</h1>
    <p>在这里写正文。</p>
  </main>
</body>
</html>
