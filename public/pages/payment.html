<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>支付系统</title>
  <style>
    :root {
      --ground:#09090b; --surface:#111113; --lane:#18181b; --lane2:#111113;
      --ink:#e4e4e7; --muted:#a1a1aa; --line:#71717a; --node:#1c1c20; --nodeStroke:#3f3f46;
      --a:#4FC0AF; --aSoft:#12302b; --b:#E0A64A; --bSoft:#33281A;
    }
    body { margin:0; background:var(--ground); color:var(--ink); font:16px/1.7 -apple-system,"PingFang SC","Noto Sans SC",sans-serif; }
    main { max-width:1240px; margin:0 auto; padding:40px 20px 72px; }
    a { color:var(--muted); } a:hover { color:#fafafa; }
    h1 { font-size:28px; margin:20px 0 6px; }
    .thesis { color:var(--muted); margin:0 0 24px; max-width:62ch; }
    .diagram { background:var(--surface); border:1px solid var(--nodeStroke); border-radius:12px; overflow-x:auto; }
    .diagram svg { display:block; min-width:1100px; width:100%; height:auto; }
    .hint { font-size:13px; color:#71717a; margin:8px 2px 0; }
    .legend { display:flex; flex-wrap:wrap; gap:8px 20px; margin:14px 2px 32px; font-size:14px; color:var(--muted); }
    .legend span { display:inline-flex; align-items:center; gap:8px; }
    .sw { width:18px; height:12px; border-radius:3px; border:2px solid; }
    .sw.a { border-color:var(--a); background:var(--aSoft); } .sw.b { border-color:var(--b); background:var(--bSoft); }
    .pillars { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:20px; }
    .pillar { border-top:3px solid; padding-top:12px; }
    .pillar.a { border-color:var(--a); } .pillar.b { border-color:var(--b); }
    .pillar h2 { margin:0 0 6px; font-size:17px; }
    .pillar.a h2 { color:var(--a); } .pillar.b h2 { color:var(--b); }
    .pillar p { margin:0 0 4px; color:var(--muted); }
    .pillar b { color:var(--ink); font-weight:600; }
    /* svg */
    .laneA{fill:var(--lane)} .laneB{fill:var(--lane2)}
    .laneLabel{fill:var(--ink);font-size:14px;font-weight:700}
    .phase{fill:var(--muted);font-size:12px;letter-spacing:.08em}
    .phaseLine{stroke:var(--nodeStroke);stroke-width:1}
    .node{fill:var(--node);stroke:var(--nodeStroke);stroke-width:1.2}
    .node.a{fill:var(--aSoft);stroke:var(--a);stroke-width:2}
    .node.b{fill:var(--bSoft);stroke:var(--b);stroke-width:2}
    .t{fill:var(--ink);font-size:13.5px;font-weight:500;text-anchor:middle}
    .s{fill:var(--muted);font-size:10.5px;text-anchor:middle}
    .mono{font-family:ui-monospace,"JetBrains Mono",monospace;font-size:10px}
    .edge{fill:none;stroke:var(--line);stroke-width:1.5}
    .edge.dash{stroke-dasharray:5 4}
    .elabel{fill:var(--muted);font-size:11px}
    .arrowHead{fill:var(--line)}
    .sep{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
  </style>
</head>
<body>
  <main>
    <a href="/#work">← 返回</a>
    <h1>支付系统 · 提现出款</h1>
    <p class="thesis">渠道出款的结果是异步回来的，事后还可能变。在这种情况下，保证钱不多打、不漏打，账最后对得上。</p>
    <div class="diagram">
      <svg viewBox="0 0 1310 530" preserveAspectRatio="xMidYMid meet" role="img" aria-label="提现出款泳道图：用户、平台、三方渠道、银行四条泳道">
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" class="arrowHead"/>
        </marker>
      </defs>

      <!-- lanes -->
      <rect x="0" y="40" width="1310" height="120" class="laneA"/>
      <rect x="0" y="160" width="1310" height="120" class="laneB"/>
      <rect x="0" y="280" width="1310" height="120" class="laneA"/>
      <rect x="0" y="400" width="1310" height="120" class="laneB"/>
      <text x="45" y="105" class="laneLabel" text-anchor="middle">用户</text>
      <text x="45" y="225" class="laneLabel" text-anchor="middle">平台</text>
      <text x="45" y="345" class="laneLabel" text-anchor="middle">三方渠道</text>
      <text x="45" y="465" class="laneLabel" text-anchor="middle">银行</text>

      <!-- phases -->
      <text x="210" y="26" class="phase" text-anchor="middle">申请</text>
      <text x="390" y="26" class="phase" text-anchor="middle">审核</text>
      <text x="630" y="26" class="phase" text-anchor="middle">出款</text>
      <text x="990" y="26" class="phase" text-anchor="middle">结果确认</text>
      <text x="1240" y="26" class="phase" text-anchor="middle">T+1 对账</text>
      <line x1="330" y1="10" x2="330" y2="40" class="phaseLine"/>
      <line x1="450" y1="10" x2="450" y2="40" class="phaseLine"/>
      <line x1="810" y1="10" x2="810" y2="40" class="phaseLine"/>
      <line x1="1170" y1="10" x2="1170" y2="40" class="phaseLine"/>
      <line x1="1170" y1="40" x2="1170" y2="520" class="sep"/>

      <!-- edges -->
      <path d="M202,100 H236 V220 H218" class="edge" marker-end="url(#ah)"/>
      <path d="M322,220 H338" class="edge" marker-end="url(#ah)"/>
      <path d="M442,220 H458" class="edge" marker-end="url(#ah)"/>
      <path d="M510,248 V340 H578" class="edge" marker-end="url(#ah)"/>
      <text x="520" y="332" class="elabel">发起代付</text>
      <path d="M682,340 H716 V460 H698" class="edge" marker-end="url(#ah)"/>
      <path d="M802,460 H836 V340 H818" class="edge" marker-end="url(#ah)"/>
      <path d="M562,220 H818" class="edge dash" marker-end="url(#ah)"/>
      <text x="690" y="210" class="elabel" text-anchor="middle">出款中 · 等结果</text>
      <path d="M870,250 V310" class="edge dash" marker-start="url(#ah)" marker-end="url(#ah)"/>
      <text x="880" y="284" class="elabel">查单</text>
      <path d="M922,340 H990 V250" class="edge" marker-end="url(#ah)"/>
      <text x="930" y="358" class="elabel">回调 · 验签</text>
      <path d="M922,220 H936" class="edge" marker-end="url(#ah)"/>
      <path d="M1042,220 H1076 V100 H1058" class="edge" marker-end="url(#ah)"/>
      <path d="M1240,312 V250" class="edge" marker-end="url(#ah)"/>

      <!-- nodes: user -->
      <rect x="98" y="72" width="104" height="56" rx="7" class="node"/>
      <text x="150" y="105" class="t">提交提现</text>
      <rect x="1058" y="72" width="104" height="56" rx="7" class="node"/>
      <text x="1110" y="96" class="t">收到结果</text>
      <text x="1110" y="114" class="s">到账 / 退回余额</text>

      <!-- nodes: platform -->
      <rect x="218" y="192" width="104" height="56" rx="7" class="node"/>
      <text x="270" y="216" class="t">冻结余额</text>
      <text x="270" y="234" class="s">余额够才冻结</text>
      <rect x="338" y="192" width="104" height="56" rx="7" class="node"/>
      <text x="390" y="225" class="t">平台审核</text>
      <rect x="458" y="192" width="104" height="56" rx="7" class="node a"/>
      <text x="510" y="216" class="t">写出款流水</text>
      <text x="510" y="234" class="s">雪花 ID 作单号</text>
      <rect x="818" y="192" width="104" height="56" rx="7" class="node b"/>
      <text x="870" y="216" class="t">定时查单</text>
      <text x="870" y="234" class="s">超 2 小时转人工</text>
      <rect x="938" y="192" width="104" height="56" rx="7" class="node a"/>
      <text x="990" y="216" class="t">定终态</text>
      <text x="990" y="234" class="s mono">WHERE 出款中</text>
      <rect x="1188" y="192" width="104" height="56" rx="7" class="node b"/>
      <text x="1240" y="216" class="t">逐笔比对</text>
      <text x="1240" y="234" class="s">差错转人工</text>

      <!-- nodes: channel -->
      <rect x="578" y="312" width="104" height="56" rx="7" class="node"/>
      <text x="630" y="336" class="t">受理代付</text>
      <text x="630" y="354" class="s">同单号只打一次</text>
      <rect x="818" y="312" width="104" height="56" rx="7" class="node"/>
      <text x="870" y="345" class="t">回调通知</text>
      <rect x="1188" y="312" width="104" height="56" rx="7" class="node"/>
      <text x="1240" y="336" class="t">对账文件</text>
      <text x="1240" y="354" class="s">昨日实际出款</text>

      <!-- nodes: bank -->
      <rect x="698" y="432" width="104" height="56" rx="7" class="node"/>
      <text x="750" y="456" class="t">跨行打款</text>
      <text x="750" y="474" class="s">收款行可能退票</text>
    </svg>
    </div>
    <p class="hint">手机上可以左右滑动看全图。</p>
    <div class="legend">
      <span><i class="sw a"></i>防重复</span>
      <span><i class="sw b"></i>最终一致</span>
    </div>
    <div class="pillars">
      <div class="pillar a">
        <h2>防重复：钱不多打，账不重记</h2>
        <p><b>单号幂等：</b>同一个商户订单号，渠道只打一次款。</p>
        <p><b>条件更新：</b>回调和查单同时到，只有一个能改状态、记账。</p>
      </div>
      <div class="pillar b">
        <h2>最终一致：钱不漏打，账对得上</h2>
        <p><b>定时查单：</b>回调丢了主动去问，超过 2 小时转人工。</p>
        <p><b>T+1 对账：</b>逐笔比对渠道文件，抓退票这类事后变了的单子。</p>
      </div>
    </div>
  </main>
</body>
</html>
