<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="order" content="1">
  <title>自持钱包 · 转账</title>
  <style>
    :root {
      --ground:#09090b; --surface:#111113; --lane:#18181b; --lane2:#111113;
      --ink:#e4e4e7; --muted:#a1a1aa; --line:#71717a; --node:#1c1c20; --nodeStroke:#3f3f46;
      --tech:#7f9c95; --a:#4FC0AF; --aSoft:#12302b; --b:#E0A64A; --bSoft:#33281A;
      --risk:#F87171; --riskSoft:#351D22; --mon:#60A5FA; --monSoft:#172336;
    }
    body { margin:0; background:var(--ground); color:var(--ink); font:16px/1.7 -apple-system,"PingFang SC","Noto Sans SC",sans-serif; }
    main { max-width:1560px; margin:0 auto; padding:12px 20px 32px; }
    a { color:var(--muted); } a:hover { color:#fafafa; }
    .top { display:flex; flex-wrap:wrap; align-items:center; gap:4px 18px; margin:0 0 10px; }
    .top h1 { font-size:20px; margin:0; }
    .top .tabs { margin:0; }
    .top .thesis { margin:0 0 0 auto; font-size:13px; }
    .thesis { margin:0 0 14px; display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 12px;
      font-family:ui-monospace,"JetBrains Mono",monospace; font-size:16px; font-weight:500; letter-spacing:-.01em; }
    .thesis .s1 { color:var(--a); }
    .thesis .s2 { color:var(--b); }
    .thesis .s3 { color:var(--mon); }
    .thesis .sep { color:#3f3f46; }
    @media (max-width: 640px) { .thesis { font-size:15px; } }
    .diagram { background:var(--surface); border:1px solid var(--nodeStroke); border-radius:12px; overflow-x:auto; }
    .diagram svg { display:block; min-width:1300px; width:100%; height:auto; }
    .hint { display:none; font-size:13px; color:#71717a; margin:8px 2px 0; }
    .legend { display:flex; flex-wrap:wrap; gap:8px 20px; margin:14px 2px 32px; font-size:14px; color:var(--muted); }
    .legend span { display:inline-flex; align-items:center; gap:8px; }
    .sw { width:18px; height:12px; border-radius:3px; border:2px solid; }
    .sw.a { border-color:var(--a); background:var(--aSoft); } .sw.b { border-color:var(--b); background:var(--bSoft); }
    .sw.risk { border-color:var(--risk); background:var(--riskSoft); }
    .risk-strip { display:flex; align-items:center; flex-wrap:wrap; gap:8px 16px; padding:14px 20px; border-top:1px solid var(--risk); background:var(--riskSoft); font-size:13px; }
    .risk-strip strong { color:var(--risk); }
    .risk-strip .arrow { color:var(--risk); }
    .sw.mon { border-color:var(--mon); background:var(--monSoft); }
    .mon-strip { display:flex; align-items:center; flex-wrap:wrap; gap:8px 16px; padding:14px 20px; border-top:1px solid var(--mon); background:var(--monSoft); font-size:13px; }
    .mon-strip strong { color:var(--mon); }
    .mon-strip .arrow { color:var(--mon); }
    .more { margin-top:28px; border-top:1px solid var(--nodeStroke); }
    .more > summary { cursor:pointer; list-style:none; padding:14px 0; font-size:14px; color:var(--muted); }
    .more > summary::-webkit-details-marker { display:none; }
    .more > summary::before { content:"+ "; color:var(--a); font-family:ui-monospace,monospace; }
    .more[open] > summary::before { content:"− "; }
    .more > summary:hover { color:var(--ink); }
    .sec { font-size:17px; margin:24px 0 12px; }
    .fails { width:100%; border-collapse:collapse; margin-bottom:40px; font-size:14px; }
    .fails th, .fails td { text-align:left; padding:12px 14px; border-bottom:1px solid var(--nodeStroke); vertical-align:top; }
    .fails th { font-size:12px; letter-spacing:.08em; color:var(--muted); font-weight:600; border-bottom-color:var(--line); }
    .fails td:first-child { color:var(--ink); width:110px; white-space:nowrap; font-weight:500; }
    .fails td + td { color:var(--muted); }
    .fails td b { color:var(--ink); font-weight:600; }
    .fails tr:last-child td { border-bottom:none; }
    @media (max-width: 860px) { .fails, .fails thead, .fails tbody, .fails tr, .fails th, .fails td { display:block; width:auto; }
      .fails thead { display:none; }
      .fails tr { padding:12px 0; border-bottom:1px solid var(--nodeStroke); }
      .fails td { border:none; padding:2px 0; }
      .fails td:first-child { width:auto; } }
    .pillars { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:20px; }
    .pillar { border-top:3px solid; padding-top:12px; }
    .pillar.a { border-color:var(--a); } .pillar.b { border-color:var(--b); } .pillar.mon { border-color:var(--mon); }
    .pillar h2 { margin:0 0 6px; font-size:17px; }
    .pillar.a h2 { color:var(--a); } .pillar.b h2 { color:var(--b); } .pillar.mon h2 { color:var(--mon); }
    .pillar p { margin:0 0 4px; color:var(--muted); }
    .pillar b { color:var(--ink); font-weight:600; }
    /* svg */
    .laneA{fill:var(--lane)} .laneB{fill:var(--lane2)}
    .laneLabel{fill:var(--ink);font-size:14px;font-weight:700}
    .phase{fill:var(--muted);font-size:12px;letter-spacing:.08em}
    .phaseLine{stroke:var(--nodeStroke);stroke-width:1}
    .node{fill:var(--node);stroke:var(--nodeStroke);stroke-width:1.2}
    .node.a{fill:var(--aSoft);stroke:var(--a);stroke-width:2}
    .node.b{fill:var(--bSoft);stroke:var(--b);stroke-width:2}
    .node.fallback{fill:none;stroke-dasharray:5 4}
    .node.fallback2{fill:none;stroke:var(--nodeStroke);stroke-dasharray:5 4}
    .t{fill:var(--ink);font-size:13.5px;font-weight:500;text-anchor:middle}
    .s{fill:var(--muted);font-size:10.5px;text-anchor:middle}
    .k{fill:var(--tech);font-family:ui-monospace,"JetBrains Mono",monospace;font-size:9.5px;text-anchor:middle}
    .mono{font-family:ui-monospace,"JetBrains Mono",monospace;font-size:10px}
    .edge{fill:none;stroke:var(--line);stroke-width:1.5}
    .edge.dash{stroke-dasharray:5 4}
    .elabel{fill:var(--muted);font-size:11px}
    .arrowHead{fill:var(--line)}
    .nbadge circle{fill:var(--ink);stroke:var(--ground);stroke-width:2}
    .nbadge text{fill:var(--ground);font-size:11px;font-weight:700;text-anchor:middle}
    .nb{display:inline-block;width:18px;height:18px;line-height:18px;border-radius:50%;background:var(--ink);color:var(--ground);font-size:11px;font-weight:700;text-align:center}
    .sep{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
    @media (max-width: 860px) { .hint { display:block; } }
    .tabs { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 10px; }
    .tabs a { padding:4px 14px; border:1px solid var(--nodeStroke); border-radius:999px; font-size:14px; color:var(--muted); text-decoration:none; }
    .tabs a:hover { color:var(--ink); border-color:var(--line); }
    .tabs a.on { color:var(--ink); border-color:var(--a); background:var(--aSoft); }
  </style>
